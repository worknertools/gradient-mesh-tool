  <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi 模糊噪点风格生成器 - 无黑边版</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000; 
            color: #fff;
            margin: 0;
            padding: 0; 
            box-sizing: border-box;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; 
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            max-width: 100%;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: stretch;
        }
        
        .panel {
            background: #c198fd; 
            color: #333333;      
            padding: 25px;       
            flex: 1;
            min-width: 300px;    
            max-width: 340px;    
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column; 
            position: relative;
            z-index: 10;
        }

        .source-preview {
            width: 100%;
            height: 160px;
            background: #000000; 
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none; 
            box-sizing: border-box;
            overflow: hidden; 
        }
        
        .source-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: none;
        }

        .source-preview span {
            color: #c198fd; 
            font-size: 14px;
            font-weight: bold;
        }

        .custom-upload-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; 
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            padding: 12px 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            cursor: pointer;
            font-size: 13px; 
            font-weight: bold;
            white-space: nowrap; 
            transition: background 0.3s;
        }
        .custom-upload-btn:hover {
            background-color: #222222;
        }
        
        .remove-btn {
            position: absolute;
            right: 15px; 
            color: #ffffff; 
            font-size: 14px;
            font-weight: normal; 
            font-family: Arial, sans-serif; 
            cursor: pointer;
            transition: color 0.3s;
        }
        .remove-btn:hover {
            color: #c198fd; 
        }

        input[type=file] {
            display: none;
        }

        .canvas-container {
            flex: 2;
            background: transparent; 
            padding: 0;
            position: relative; 
        }
        
        canvas {
            background-color: transparent; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: contain;
        }

        .control-group {
            margin-bottom: 20px;
        }
        label.slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold; 
        }
        
        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #000000; 
        }
        
        .export-title {
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #000000; 
            text-align: left; 
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button.export-btn {
            background-color: #000000; 
            color: #ffffff; 
            border: none;
            padding: 12px 0;
            font-size: 15px;
            font-weight: normal; 
            cursor: pointer;
            flex: 1; 
            transition: background 0.3s;
        }
        button.export-btn:hover {
            background-color: #333333; 
        }

        .footer-text {
            margin-top: auto; 
            padding-top: 30px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #000000;
            opacity: 0.6; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 控制面板 -->
        <div class="panel">
            
            <!-- 原图预览框 -->
            <div class="source-preview" id="source-preview-box">
                <span id="preview-text">Preview</span>
                <img id="preview-img" src="" alt="原图预览">
            </div>

            <!-- 上传按钮 -->
            <label for="upload" class="custom-upload-btn" id="upload-label">
                <span id="upload-text">上传图片 UPLOAD</span>
                <span class="remove-btn" id="remove-btn" style="display: none;" title="移除图片">✕</span>
            </label>
            <input type="file" id="upload" accept="image/*">
            
            <div class="control-group">
                <label class="slider-label"><span>模糊度 (Blur)</span> <span id="blur-val">25</span></label>
                <input type="range" id="blur" min="0" max="100" value="25">
            </div>
            
            <div class="control-group">
                <label class="slider-label"><span>饱和度 (Saturation)</span> <span id="sat-val">180%</span></label>
                <input type="range" id="saturation" min="100" max="300" value="180">
            </div>

            <div class="control-group">
                <label class="slider-label"><span>对比度 (Contrast)</span> <span id="con-val">120%</span></label>
                <input type="range" id="contrast" min="100" max="200" value="120">
            </div>
            
            <div class="control-group">
                <label class="slider-label"><span>噪点强度 (Noise)</span> <span id="noise-val">40</span></label>
                <input type="range" id="noise" min="0" max="150" value="40">
            </div>

            <div class="control-group">
                <label class="slider-label"><span>图形缩放 (Scale)</span> <span id="scale-val">59%</span></label>
                <input type="range" id="scale" min="10" max="200" value="59">
            </div>

            <div class="export-title">导出 Export (A3 高清级别)</div>

            <div class="btn-group">
                <button id="download-jpg" class="export-btn">下载 JPG</button>
                <button id="download-png" class="export-btn">下载 PNG</button>
            </div>

            <!-- 底部版权信息 -->
            <div class="footer-text">2026 ©Design by Type play Studio</div>
        </div>

        <!-- 预览面板 -->
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let currentImage = new Image();

        const upload = document.getElementById('upload');
        const blurSlider = document.getElementById('blur');
        const satSlider = document.getElementById('saturation');
        const conSlider = document.getElementById('contrast');
        const noiseSlider = document.getElementById('noise');
        const scaleSlider = document.getElementById('scale');
        
        const downloadJpgBtn = document.getElementById('download-jpg');
        const downloadPngBtn = document.getElementById('download-png');
        
        const previewImg = document.getElementById('preview-img');
        const previewText = document.getElementById('preview-text');
        
        const uploadText = document.getElementById('upload-text');
        const removeBtn = document.getElementById('remove-btn');

        function updateLabels() {
            document.getElementById('blur-val').innerText = blurSlider.value;
            document.getElementById('sat-val').innerText = satSlider.value + '%';
            document.getElementById('con-val').innerText = conSlider.value + '%';
            document.getElementById('noise-val').innerText = noiseSlider.value;
            document.getElementById('scale-val').innerText = scaleSlider.value + '%'; 
        }

        upload.addEventListener('click', function() {
            this.value = null;
        });

        upload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('请选择有效的图片文件！');
                return;
            }

            const originalName = file.name;
            const displayName = originalName.length > 8 ? originalName.substring(0, 8) + '...' : originalName;

            const reader = new FileReader();
            reader.onload = function(event) {
                const tempImage = new Image();
                tempImage.crossOrigin = "Anonymous"; 
                
                tempImage.onload = function() {
                    currentImage = tempImage;
                    uploadText.innerText = displayName;
                    uploadText.style.fontWeight = 'normal'; 
                    removeBtn.style.display = 'block';

                    previewImg.src = currentImage.src;
                    previewImg.style.display = 'block';
                    previewText.style.display = 'none';
                    
                    requestAnimationFrame(() => {
                        applyEffects(false); 
                    });
                }
                
                tempImage.onerror = function() {
                    alert('图片解码失败，请检查文件是否损坏或尝试其他图片。');
                }
                tempImage.src = event.target.result;
            }
            
            reader.onerror = function() {
                alert('读取文件遇到错误，请重试！');
            }
            reader.readAsDataURL(file);
        });

        removeBtn.addEventListener('click', function(e) {
            e.preventDefault(); 
            e.stopPropagation(); 

            upload.value = ''; 
            currentImage = new Image(); 
            
            previewImg.src = '';
            previewImg.style.display = 'none';
            previewText.style.display = 'block';
            
            uploadText.innerText = '上传图片 UPLOAD';
            uploadText.style.fontWeight = 'bold'; 
            this.style.display = 'none';
            
            canvas.width = 0;
            canvas.height = 0;
            canvas.style.width = '';  
            canvas.style.height = ''; 
            ctx.clearRect(0, 0, 0, 0);
        });

        let rAF = null;
        [blurSlider, satSlider, conSlider, noiseSlider, scaleSlider].forEach(slider => {
            slider.addEventListener('input', () => {
                updateLabels();
                if (rAF) cancelAnimationFrame(rAF);
                rAF = requestAnimationFrame(() => {
                    applyEffects(false);
                });
            });
        });

        function applyEffects(isExport = false) {
            if (!currentImage.src) return;

            try {
                const scale = parseInt(scaleSlider.value, 10) / 100;
                const fullWidth = currentImage.width * scale;
                const fullHeight = currentImage.height * scale;
                
                let renderWidth, renderHeight, effectScale, grainRatio;
                
                // 计算当前预览状态的降维系数（作为噪点颗粒等比例放大的基准）
                const MAX_PREVIEW = 1200;
                let previewRatio = 1;
                if (fullWidth > MAX_PREVIEW || fullHeight > MAX_PREVIEW) {
                    previewRatio = Math.min(MAX_PREVIEW / fullWidth, MAX_PREVIEW / fullHeight);
                }

                if (isExport) {
                    const A3_LONG_EDGE = 4960;
                    const imgLongEdge = Math.max(currentImage.width, currentImage.height);
                    const exportMultiplier = A3_LONG_EDGE / imgLongEdge;
                    
                    renderWidth = currentImage.width * exportMultiplier * scale;
                    renderHeight = currentImage.height * exportMultiplier * scale;
                    effectScale = exportMultiplier * scale;
                    // 【核心修复】：计算出导出尺寸是预览图的多少倍，以此同比例放大噪点区块尺寸，保障100%视觉一致
                    grainRatio = exportMultiplier / previewRatio;
                } else {
                    renderWidth = fullWidth * previewRatio;
                    renderHeight = fullHeight * previewRatio;
                    effectScale = scale * previewRatio;
                    grainRatio = 1;
                }

                canvas.width = Math.max(1, Math.floor(renderWidth));
                canvas.height = Math.max(1, Math.floor(renderHeight));

                // 【核心修复】：即便处于导出状态也不清空 CSS 尺寸，阻止导出瞬间画布的剧烈跳动
                canvas.style.width = fullWidth + 'px';
                canvas.style.height = fullHeight + 'px';

                const scaledCanvas = document.createElement('canvas');
                scaledCanvas.width = canvas.width;
                scaledCanvas.height = canvas.height;
                const sCtx = scaledCanvas.getContext('2d');
                sCtx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
                
                const sourceImage = scaledCanvas;

                const blurVal = parseInt(blurSlider.value, 10);
                const blur = blurVal * effectScale; 
                const sat = parseInt(satSlider.value, 10);
                const con = parseInt(conSlider.value, 10);
                const noiseAmount = parseInt(noiseSlider.value, 10);

                if (blur > 0) {
                    const padding = Math.ceil(blur * 2); 
                    
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = canvas.width + padding * 2;
                    offCanvas.height = canvas.height + padding * 2;
                    const oCtx = offCanvas.getContext('2d');

                    oCtx.drawImage(sourceImage, padding, padding, canvas.width, canvas.height);

                    oCtx.drawImage(sourceImage, 0, 0, canvas.width, 1, padding, 0, canvas.width, padding);
                    oCtx.drawImage(sourceImage, 0, canvas.height - 1, canvas.width, 1, padding, padding + canvas.height, canvas.width, padding);
                    oCtx.drawImage(sourceImage, 0, 0, 1, canvas.height, 0, padding, padding, canvas.height);
                    oCtx.drawImage(sourceImage, canvas.width - 1, 0, 1, canvas.height, padding + canvas.width, padding, padding, canvas.height);
                    
                    oCtx.drawImage(sourceImage, 0, 0, 1, 1, 0, 0, padding, padding); 
                    oCtx.drawImage(sourceImage, canvas.width - 1, 0, 1, 1, padding + canvas.width, 0, padding, padding); 
                    oCtx.drawImage(sourceImage, 0, canvas.height - 1, 1, 1, 0, padding + canvas.height, padding, padding); 
                    oCtx.drawImage(sourceImage, canvas.width - 1, canvas.height - 1, 1, 1, padding + canvas.width, padding + canvas.height, padding, padding); 

                    ctx.filter = `blur(${blur}px) saturate(${sat}%) contrast(${con}%)`;
                    ctx.drawImage(offCanvas, -padding, -padding);
                } else {
                    ctx.filter = `saturate(${sat}%) contrast(${con}%)`;
                    ctx.drawImage(sourceImage, 0, 0, canvas.width, canvas.height);
                }

                ctx.filter = 'none'; 

                if (noiseAmount > 0) {
                    addNoise(noiseAmount, grainRatio);
                }
            } catch (err) {
                console.error("渲染遇到意外错误:", err);
                if (isExport) alert("导出失败：您设定的[图形缩放]比例乘算后的尺寸超出了当前设备的内存限制，请稍微调低缩放比例。");
            }
        }

        // 【算法重写】：支持按颗粒缩放比例 grainRatio 生成完美区块噪点，保证高清图效果与小预览图100%肉眼对齐
        function addNoise(amount, grainRatio = 1) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const noiseIntensity = (amount / 100) * 255;
            
            if (grainRatio <= 1) {
                // 原尺寸预览或下行降级的噪点直出
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * noiseIntensity;
                    let r = data[i] + noise;
                    let g = data[i + 1] + noise;
                    let b = data[i + 2] + noise;
                    data[i]     = r > 255 ? 255 : (r < 0 ? 0 : r);
                    data[i + 1] = g > 255 ? 255 : (g < 0 ? 0 : g);
                    data[i + 2] = b > 255 ? 255 : (b < 0 ? 0 : b);
                }
            } else {
                // 导出大图时，创建与用户在屏幕上看到同等密度和像素感的区块参考图谱
                const w = canvas.width;
                const h = canvas.height;
                const refW = Math.ceil(w / grainRatio);
                const refH = Math.ceil(h / grainRatio);

                const noiseMap = new Float32Array(refW * refH);
                for (let i = 0; i < noiseMap.length; i++) {
                    noiseMap[i] = (Math.random() - 0.5) * noiseIntensity;
                }

                let ptr = 0;
                for (let y = 0; y < h; y++) {
                    const refY = Math.floor(y / grainRatio);
                    const rowOffset = refY * refW;
                    for (let x = 0; x < w; x++) {
                        const refX = Math.floor(x / grainRatio);
                        const noise = noiseMap[rowOffset + refX]; // 等比块拾取噪点信息
                        
                        let r = data[ptr] + noise;
                        let g = data[ptr + 1] + noise;
                        let b = data[ptr + 2] + noise;
                        data[ptr]     = r > 255 ? 255 : (r < 0 ? 0 : r);
                        data[ptr + 1] = g > 255 ? 255 : (g < 0 ? 0 : g);
                        data[ptr + 2] = b > 255 ? 255 : (b < 0 ? 0 : b);
                        ptr += 4;
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        function downloadImage(format) {
            if (!currentImage.src) {
                alert('请先上传图片！');
                return;
            }
            
            const btn = format === 'png' ? downloadPngBtn : downloadJpgBtn;
            const originalText = btn.innerText;
            // 【文案更改】
            btn.innerText = 'Loading...';
            btn.disabled = true;

            setTimeout(() => {
                applyEffects(true);
                
                try {
                    const link = document.createElement('a');
                    
                    if (format === 'png') {
                        link.download = 'dreamcore-a3-hd.png';
                        link.href = canvas.toDataURL('image/png', 1.0);
                    } else if (format === 'jpg') {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = canvas.width;
                        tempCanvas.height = canvas.height;
                        const tCtx = tempCanvas.getContext('2d');
                        tCtx.fillStyle = '#ffffff';
                        tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                        tCtx.drawImage(canvas, 0, 0);
                        
                        link.download = 'dreamcore-a3-hd.jpg';
                        link.href = tempCanvas.toDataURL('image/jpeg', 1.0); 
                    }
                    
                    link.click();
                } catch (err) {
                    console.error("生成下载连接失败:", err);
                    alert("生成文件失败：当前设定的精度超出浏览器可分配内存，请尝试降低[图形缩放]比例后重试。");
                }
                
                applyEffects(false);
                btn.innerText = originalText;
                btn.disabled = false;
            }, 100); // 轻微延迟，保障UI的 Loading... 能够得到渲染
        }

        downloadJpgBtn.addEventListener('click', () => downloadImage('jpg'));
        downloadPngBtn.addEventListener('click', () => downloadImage('png'));
    </script>
</body>
</html>
    
  </body>
